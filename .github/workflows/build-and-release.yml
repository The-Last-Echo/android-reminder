name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version Name and Code
        id: versioning
        run: |
          APP_VERSION_NAME=$(sed -n 's/^appVersionName=//p' gradle.properties | tail -n 1)
          APP_VERSION_CODE=$(sed -n 's/^appVersionCode=//p' gradle.properties | tail -n 1)

          if [[ -z "$APP_VERSION_NAME" || ! "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::gradle.properties must define a valid appVersionName and positive appVersionCode."
            exit 1
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$APP_VERSION_NAME" ]]; then
              echo "::error::Tag version $TAG_VERSION does not match appVersionName $APP_VERSION_NAME in gradle.properties."
              exit 1
            fi
            echo "Building release $GITHUB_REF_NAME with versionCode $APP_VERSION_CODE from gradle.properties"
            echo "APP_VERSION=$APP_VERSION_NAME" >> "$GITHUB_ENV"
            echo "IS_TAG=true" >> "$GITHUB_ENV"
          else
            echo "Building branch ${{ github.ref_name }} with versionCode $APP_VERSION_CODE from gradle.properties"
            echo "APP_VERSION=${APP_VERSION_NAME}-dev" >> "$GITHUB_ENV"
            echo "IS_TAG=false" >> "$GITHUB_ENV"
          fi

          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Validate Signing Secrets (on Tag push)
        if: env.IS_TAG == 'true'
        run: |
          MISSING=0
          if [ -z "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "::error::Secret SIGNING_KEYSTORE is missing or empty!"
            MISSING=1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD is missing or empty!"
            MISSING=1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Secret KEY_ALIAS is missing or empty!"
            MISSING=1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secret KEY_PASSWORD is missing or empty!"
            MISSING=1
          fi
          if [ $MISSING -eq 1 ]; then
            echo "::error::Release build failed: Required signing secrets are missing in repository settings."
            exit 1
          fi

      - name: Run Offline and Online Unit Tests
        run: ./gradlew testOfflineDebugUnitTest testOnlineDebugUnitTest

      - name: Build Offline and Online Debug APKs
        run: ./gradlew assembleOfflineDebug assembleOnlineDebug -PappVersionCode=${{ env.APP_VERSION_CODE }} -PappVersionName=${{ env.APP_VERSION }}

      - name: Verify Offline Debug manifest has no network permissions
        run: >-
          python3 scripts/check_offline_manifest.py
          app/build/intermediates/packaged_manifests/offlineDebug/processOfflineDebugManifestForPackage/AndroidManifest.xml

      - name: Decode Keystore for Release
        if: env.IS_TAG == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > /tmp/release.keystore

      - name: Build Signed Release APK
        if: env.IS_TAG == 'true'
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleOfflineRelease assembleOnlineRelease -PappVersionCode=${{ env.APP_VERSION_CODE }} -PappVersionName=${{ env.APP_VERSION }}

      - name: Verify Offline Release manifest has no network permissions
        if: env.IS_TAG == 'true'
        run: >-
          python3 scripts/check_offline_manifest.py
          app/build/intermediates/packaged_manifests/offlineRelease/processOfflineReleaseManifestForPackage/AndroidManifest.xml

      - name: Clean up Keystore File
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Prepare Assets for Distribution
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/offline/debug/app-offline-debug.apk release-assets/reminder-v${{ env.APP_VERSION }}-offline-debug.apk
          cp app/build/outputs/apk/online/debug/app-online-debug.apk release-assets/reminder-v${{ env.APP_VERSION }}-online-debug.apk
          if [ -f app/build/outputs/apk/online/release/app-online-release.apk ]; then
            cp app/build/outputs/apk/online/release/app-online-release.apk release-assets/reminder-v${{ env.APP_VERSION }}-online.apk
          fi
          if [ -f app/build/outputs/apk/offline/release/app-offline-release.apk ]; then
            cp app/build/outputs/apk/offline/release/app-offline-release.apk release-assets/reminder-v${{ env.APP_VERSION }}-offline.apk
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-APKs-${{ env.APP_VERSION }}
          path: release-assets/

      - name: Generate Changelog
        if: env.IS_TAG == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "## What's Changed in ${{ github.ref_name }}" > changelog.md
          echo "" >> changelog.md
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" >> changelog.md
            git log --pretty=format:"* %s (%h)" "$PREV_TAG"..${{ github.ref_name }} >> changelog.md
          else
            echo "Initial release changes:" >> changelog.md
            git log --pretty=format:"* %s (%h)" ${{ github.ref_name }} >> changelog.md
          fi
          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "**Compatibility**: Android 8.0+ (API 26 to 36). Fully compatible with Obtainium." >> changelog.md

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            release-assets/reminder-v${{ env.APP_VERSION }}-online.apk
            release-assets/reminder-v${{ env.APP_VERSION }}-offline.apk
            release-assets/reminder-v${{ env.APP_VERSION }}-online-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: false
